- id: nav_go
  parameters:
    slot: int
  then:
  - if:
      condition:
        lambda: !lambda 'return slot == 0;'
      then:
      - lvgl.page.show: pg_now
  - if:
      condition:
        lambda: !lambda 'return slot == 1;'
      then:
      - lvgl.page.show: pg_today
  - if:
      condition:
        lambda: !lambda 'return slot == 2;'
      then:
      - lvgl.page.show: pg_hist
  - if:
      condition:
        lambda: !lambda 'return slot == 3;'
      then:
      - lvgl.page.show: pg_fc
- id: wifi_open
  then:
  - lvgl.page.show: pg_wifi
- id: wifi_back
  then:
