# Guition JC8048W550 / ESP32-S3, 5-inch 800x480 capacitive display.
# Generated by tools/gen_display_5inch.py. Keep the 4-inch package separate.
output:
  - platform: ledc
    id: backlight_output
    pin: GPIO2
    frequency: 100Hz
    min_power: 0.01
    zero_means_zero: true

light:
  - platform: monochromatic
    name: "Backlight"
    id: display_backlight
    output: backlight_output
    restore_mode: ALWAYS_ON
    default_transition_length: 500ms

i2c:
  id: touch_bus
  sda: GPIO19
  scl: GPIO20

display:
  - platform: rpi_dpi_rgb
    id: tft_display
    color_order: RGB
    invert_colors: true
    update_interval: never
    auto_clear_enabled: false
    dimensions:
      width: 800
      height: 480
    de_pin: GPIO40
    hsync_pin: GPIO39
    vsync_pin: GPIO41
    pclk_pin: GPIO42
    pclk_frequency: 16MHz
    data_pins:
      red: [GPIO45, GPIO48, GPIO47, GPIO21, GPIO14]
      green: [GPIO5, GPIO6, GPIO7, GPIO15, GPIO16, GPIO4]
      blue: [GPIO8, GPIO3, GPIO46, GPIO9, GPIO1]

touchscreen:
  - platform: gt911
    id: tft_touch
    display: tft_display
    on_touch:
      - lambda: 'id(g_display_wake).touch(true, millis());'
      - script.execute: apply_display
    on_release:
      - lambda: 'id(g_display_wake).touch(false, millis());'
      - script.execute: apply_display

