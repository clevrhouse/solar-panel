# =============================================================================
#  Victron GX panel -- Guition JC8048W550 (5", 800x480)
#
#  One firmware for every Victron site. Nothing here is specific to your
#  installation: the Clevr Victron integration in Home Assistant finds the Cerbo
#  through your existing MQTT setup and sends the panel everything it shows
#  (live values, phases, battery, forecast, history). Install the clevr_victron
#  integration from home-assistant/custom_components in Home Assistant.
#
#  There are no MQTT settings, portal IDs, instance numbers or entity IDs to
#  edit. Build, flash, add your Wi-Fi on the panel's touch screen, add it in Home
#  Assistant (ESPHome) and allow it to perform actions.
# =============================================================================

substitutions:
  device_name: "victron-panel-5in"
  friendly_name: "Victron Panel 5in"
  panel_version: "gx-panel 2.3.0-5in-dev5"
  # IANA time zone. Home Assistant 2026.3+ also syncs it to the panel.
  timezone: "Europe/Bucharest"
  # "true": hostname gets the MAC suffix (several panels). "false": keep the
  # plain device_name, e.g. to OTA-update a panel already added to HA under it.
  mac_suffix: "true"

packages:
  display: !include victron_5in/display-guition-jc8048w550.yaml
  data: !include victron_5in/victron-data.yaml

esphome:
  name: ${device_name}
  friendly_name: ${friendly_name}
  # Several panels on one network: the MAC suffix keeps each hostname unique.
  name_add_mac_suffix: ${mac_suffix}
  project:
    name: clevr.victron_panel_5in
    version: "2.3.0-5in-dev5"
  # Rendering helpers. ui.h is generated with the display package.
  includes:
    # Angle-bracket include is emitted before ESPHome global declarations.
    - <panel.h>
    - victron_5in/ui.h
    - victron_5in/data_state.h
    - victron_5in/live_feed.h
    - victron_5in/nav_slots.h
    - victron_5in/history_5in.h
    - victron_5in/panel.h
    - victron_5in/wifi_setup.h
    - victron_5in/wifi_ui.h
    - victron_5in/wifi_link.h
  on_boot:
    - priority: -100
      then:
        - script.execute: ui_register
        - lambda: |-
            id(g_ui_ready) = true;
            vp::render_nav(id(g_page));
        - script.execute: render_page
        - script.execute: apply_display

esp32:
  board: esp32-s3-devkitc-1
  variant: esp32s3
  flash_size: 16MB
  framework:
    type: esp-idf
    sdkconfig_options:
      # rpi_dpi_rgb uses an internal bounce buffer for the PSRAM framebuffer.
      # Espressif recommends 64-byte DCache lines for that mode to avoid shifts.
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
    # NOTE: do not add CONFIG_SPIRAM_FETCH_INSTRUCTIONS / CONFIG_SPIRAM_RODATA
    # here. They relocate .text and .rodata into PSRAM and, on this board,
    # panic before the console is even up: ROM banner, rst:0xc, repeat, with
    # no ESPHome output at all. The cache options below are safe to try LATER,
    # one at a time, once the board is stable again:
    #   CONFIG_ESP32S3_DATA_CACHE_64KB: "y"

psram:
  mode: octal
  speed: 80MHz

logger:
  # The ESP32-S3's native USB lives on GPIO19/20, which this board uses for
  # touch I2C and the RGB green bus. The USB-C socket therefore goes through a
  # USB-UART bridge on UART0 -- but ESPHome's default on S3 is USB_SERIAL_JTAG,
  # so without this line every log line goes nowhere and you only ever see the
  # ROM banner.
  hardware_uart: UART0
  baud_rate: 115200

  level: INFO
  # Keep the UART quiet; verbose logging competes with the RGB DMA.

api:
  on_client_disconnected:
    - lambda: |-
        // A log client disconnect must not invalidate the live HA feed.
        if (!vp::ha_connected(api::global_api_server, 0)) {
          id(g_energy).clear();
          id(g_fresh).clear();      // live values come from HA: none are current without it
          id(g_mqtt_last) = 0;
          id(g_gx_mq) = false;
          id(g_gx_age0) = -1;
        }

json:

ota:
  - platform: esphome
    on_begin:
      # Blank the backlight during OTA or the panel tears badly.
      - light.turn_off:
          id: display_backlight
          transition_length: 0s
      - lambda: "id(display_backlight).loop();"

wifi:
  # No Wi-Fi credentials are compiled in. Add the network on the panel itself:
  # tap the Wi-Fi symbol (top right) or Settings > Network > ADD WI-FI, choose the
  # network and type the password on the touch keyboard. Up to three networks are
  # stored in flash (victron/wifi_setup.h). The access point below and its captive
  # portal stay available as a fallback. To compile credentials in instead, add
  #   ssid: !secret wifi_ssid
  #   password: !secret wifi_password
  domain: .local
  power_save_mode: NONE
  reboot_timeout: 0s
  ap:
    ssid: "Clevr Victron 5in Setup"
    password: "clevrsetup"

captive_portal:

time:
  # Time comes from Home Assistant (needed for clock, night dimming, history).
  - platform: homeassistant
    id: sntp_time
    timezone: ${timezone}
